name: Build and deploy

# A push to main publishes to https://docs.heavendata.com. Pull requests build but
# do not deploy, so a broken change fails the PR instead of the live site — which
# matters here because "Edit this page on GitHub" is enabled and edits can come
# from the web UI.
#
# NOTE: this only takes effect once the repository's Pages source is switched from
# "Deploy from a branch" to "GitHub Actions" (Settings -> Pages -> Build and
# deployment -> Source). Until then this workflow runs and deploys nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must run BEFORE setup-node: `cache: pnpm` below needs the pnpm binary
      # on PATH to resolve the store directory.
      - uses: pnpm/action-setup@v6

      # Deliberately v5, not the latest v7: v5 is the first release on Node 24 (the
      # deprecation this bump is for), and every major since has changed *automatic*
      # cache detection — the one feature this step depends on. `cache: pnpm` is
      # explicit so those changes should not reach us, but there is no reason to
      # cross two breaking majors to fix a runtime deprecation. checkout and
      # action-setup went to latest because their majors are inert for this workflow.
      #
      # node-version is the runtime the SITE builds with. It is unrelated to the Node
      # the actions themselves run on, which the runner now forces to 24.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # A green build is not proof the site is usable. Both of the failures found
      # during the migration were silent: an empty sidebar, and internal links
      # pointing at paths that were never emitted. Assert against the output.
      # Both checks live in .github/scripts/ so they can be run locally with
      # `pnpm verify` before pushing — which is the whole point. They used to be
      # inline here, where nobody could run them, and the 2026-09-02 restructure
      # duly broke one and only found out from a red build.
      - name: Smoke-check the built site
        run: node .github/scripts/smoke-check.mjs

      - name: Check every internal link resolves
        run: node .github/scripts/check-links.mjs

      # v5, not v3: v3 pulls actions/upload-artifact@v4 internally, which is itself
      # a deprecated Node 20 action — invisible in the warning until the three
      # direct ones were fixed. v5 bundles upload-artifact@v7.
      #
      # v4 dropped dotfiles from the artifact (breaking). Checked: dist/ contains
      # none, and no .nojekyll is needed because the Actions deploy path does not
      # run Jekyll. v5 also adds `include-hidden-files` if that ever changes.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # These two are NOT version-locked — the official Pages starter workflow
        # pairs upload-pages-artifact@v3 with deploy-pages@v5. v5 here is a pure
        # Node 24 bump with no behaviour change.
        uses: actions/deploy-pages@v5
