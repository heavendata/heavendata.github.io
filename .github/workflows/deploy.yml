name: Build and deploy

# A push to main publishes to https://docs.heavendata.com. Pull requests build but
# do not deploy, so a broken change fails the PR instead of the live site — which
# matters here because "Edit this page on GitHub" is enabled and edits can come
# from the web UI.
#
# NOTE: this only takes effect once the repository's Pages source is switched from
# "Deploy from a branch" to "GitHub Actions" (Settings -> Pages -> Build and
# deployment -> Source). Until then this workflow runs and deploys nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # A green build is not proof the site is usable. Both of the failures found
      # during the migration were silent: an empty sidebar, and internal links
      # pointing at paths that were never emitted. Assert against the output.
      - name: Smoke-check the built site
        run: |
          set -euo pipefail
          pages=$(find dist -name '*.html' | wc -l)
          echo "built $pages HTML pages"
          [ "$pages" -ge 31 ] || { echo "::error::expected at least 31 pages, got $pages"; exit 1; }
          test -f dist/pagefind/pagefind-entry.json || { echo "::error::search index missing"; exit 1; }
          test -f dist/CNAME || { echo "::error::CNAME missing — the custom domain would drop"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "::error::sitemap missing"; exit 1; }
          grep -q 'href="/en/settings/attributes.html"' dist/en/settings/product-types.html \
            || { echo "::error::sidebar/nav links missing or wrong URL format"; exit 1; }

      - name: Check every internal link resolves
        run: node .github/scripts/check-links.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
